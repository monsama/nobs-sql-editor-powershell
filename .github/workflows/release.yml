name: release

# Publishes the release for a version tag: the script itself, its SHA-256 in a file and in the
# notes, and the notes - written by hand in .github/release-notes/<tag>.md when that file is there
# at the tag, GitHub's generated changelog otherwise. cut-release.yml makes the tag and starts this.
#
# This exists because the download here is a PowerShell script that people are told to run with
# -ExecutionPolicy Bypass, and until now it was the one download of this project that published
# nothing to check it against - the desktop edition's installers have carried a checksum since
# 1.3.5, because SignPath declined to sign them. Doing it by hand at release time is how the
# desktop edition's notes ended up promising checksums they did not carry for four releases
# running, so it is done here by the thing that makes the release.
on:
  push:
    tags: ["v*"]
  # cut-release.yml starts it this way (a tag it pushes fires no push trigger), and so a release can
  # be made again for a tag without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

# One release at a time: two runs for one tag would make two releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Nothing here needs Windows: it hashes one file and writes two.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The version in the script has to be the version in the tag, or the app's own update notice
      # compares against something that was never released. Cheap to check, and only checkable here.
      - name: The tag and the script agree on the version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          said=$(grep -oE "AppVersion = '[^']+'" NOBSSQL.ps1 | head -1 | grep -oE "[0-9]+(\.[0-9]+)*")
          echo "tag ${tag}, script ${said}"
          [ "v${said}" = "$tag" ] || { echo "the tag says ${tag} and the script says ${said}"; exit 1; }

      - name: Checksum
        run: |
          sha256sum NOBSSQL.ps1 | tee SHA256SUMS.txt
          {
            echo
            echo '### Verify your download'
            echo
            echo 'This script is not code-signed. Compare what you downloaded against the SHA-256 below:'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo 'PowerShell: ``Get-FileHash .\NOBSSQL.ps1 -Algorithm SHA256``'
            echo
            echo 'See [CODE_SIGNING.md](https://github.com/monsama/nobs-sql-editor/blob/main/CODE_SIGNING.md) for what this does and does not prove.'
          } > release-notes-append.md

      # The hand-written notes go first, then the checksum block. Without a notes file, GitHub's
      # generated changelog stands in for them.
      - name: Notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [ -f ".github/release-notes/${tag}.md" ]; then
            cat ".github/release-notes/${tag}.md" release-notes-append.md > release-notes.md
            echo "GENERATED=false" >> "$GITHUB_ENV"
          else
            cp release-notes-append.md release-notes.md
            echo "GENERATED=true" >> "$GITHUB_ENV"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            NOBSSQL.ps1
            SHA256SUMS.txt
          draft: false
          make_latest: true
          generate_release_notes: ${{ env.GENERATED == 'true' }}
          append_body: ${{ env.GENERATED == 'true' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

      # The action sometimes fails to find the tag it was given and leaves the release a draft
      # named "untagged-<sha>" instead (it did to the desktop edition's 1.9.0). Found by its name
      # and set right, every time: on a release that came out right this changes nothing.
      - name: Set the release's tag and publish it, if the action did not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.name == \"$tag\") | .id" | head -n1)
          [ -n "$id" ] || { echo "::error::no release named $tag"; exit 1; }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -f tag_name="$tag" -F draft=false -f make_latest=true > /dev/null
