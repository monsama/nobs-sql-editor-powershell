name: tag-and-release

# One-off: tags main and pushes it with this job's own GITHUB_TOKEN, which has the contents: write
# permission an external git credential here doesn't. A tag pushed with GITHUB_TOKEN does not
# trigger other workflows' `on: push` triggers (GitHub's anti-loop rule), so release.yml is
# dispatched explicitly against the new tag rather than relying on the push to fire it - a
# workflow_dispatch run against a tag ref sets github.ref/ref_type exactly as a real tag push would.
# Delete this workflow file once used.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release, e.g. 1.7.0 (no leading v)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Tag and push
        run: |
          V="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "v$V"

      - name: Start the release draft on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ github.event.inputs.version }}" -f tag="v${{ github.event.inputs.version }}"
