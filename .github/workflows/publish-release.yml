name: publish-release

# One-off: publishes the drafted release for a tag with this job's own GITHUB_TOKEN, with the
# hand-written notes in .github/release-notes/<tag>.md ahead of the drafted ones (the checksum
# block). Found by name, and its tag set again, in case the draft landed "untagged". Delete this
# workflow and the notes file once used.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the drafted release, e.g. v1.8.0"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.name == \"$TAG\") | .id" | head -n1)
          [ -n "$ID" ] || { echo "no release named $TAG"; exit 1; }
          gh api "repos/${{ github.repository }}/releases/$ID" --jq .body > drafted.md
          # The drafted body ends with GitHub's generated "Full Changelog" line, which the notes carry already.
          grep -v '^\*\*Full Changelog\*\*' drafted.md > drafted-trim.md || true
          cat ".github/release-notes/$TAG.md" drafted-trim.md > body.md
          gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -f tag_name="$TAG" -F draft=false -f make_latest=true -F body=@body.md
